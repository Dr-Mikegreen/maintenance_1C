general:
  backups_path: "/home/admins/backup/"
  ibcmd_path: "/opt/1cv8/x86_64/8.5.1.1529/" #Обязательно после каждого обновления исправлять на новый!
  log_path: "/home/admins/backup/"
  1c_stop: true                               #Останавливать службу сервера 1С на время выполнения функций программы. (рекомендуется, но не обязательно)
  time_to_start: "23:00"                      #Время для запуска утилиты

server_settings:
  dbms: "PostgreSQL"                          #Может быть только PostgreSQL или MSSQL (пусто, если все базы файловые)
  srv: "localhost"                            #имя или IP адрес
  port: 5433
  dbms_user: "postgres"
  dbms_password: "159357"

schedule_settings: 
  daily:
    delete_older: 20160                       #Сколькок минут хранить ежедневные копии
  weekly:
    delete_older: 90                          #Сколькок дней хранить еженедельные копии
  monthly:
    delete_older: 365                         #Сколькок дней хранить ежемесячные копии
    maintenance_types:
      - STATISTICS
      - INDEXES
      - INTEGRITY

bases:
  - mode: "file"
    dbdir: '/home/admins/testfiledb/'                         #Может быть сетевым
    user: ""                        #Оставить пустым если не заданы в БД
    password: ""                         #Оставить пустым если не заданы в БД
    chkdb: false                                #Выполнять проверку этой БД улилитой chdbfl.exe (только для Windows)
    validate_restore: false                     #Выполнять проверку резервной копии после выгрузки. Использовать с осторожностью, особенно для больших БД. Требуется значительно больше времени. Программа разворачивает временную пустую базу, восстанввливает данные из резервной копии, проверяет корректность загрузки, затем удаляет временную базу.
    schedules:                                  #В каких расписаниях участвует эта БД
      - weekly
      - monthly
  - mode: "dbms"
    dbname: "test01"
    user: ""                        #Оставить пустым если не заданы в БД
    password: ""                         #Оставить пустым если не заданы в БД
    chkdb: false                                #Выполнять проверку этой БД средствами СУБД
    validate_restore: false                     #Выполнять проверку резервной копии после выгрузки. Использовать с осторожностью, особенно для больших БД. Требуется значительно больше времени. Программа разворачивает временную пустую базу, восстанввливает данные из резервной копии, проверяет корректность загрузки, затем удаляет временную базу.
    schedules:                                  #В каких расписаниях участвует эта БД
      - daily
      - weekly
      - monthly